image: ghcr.io/cirruslabs/android-sdk:34

stages:
  - build

build-apk:
  stage: build
  before_script:
    - apt-get update && apt-get install -y curl openjdk-21-jdk
    - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
    - apt-get install -y nodejs
    - export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
  script:
    - npm install
    - npm run build
    - npm install @capacitor/core @capacitor/android
    - npm install @capacitor/cli -D
    - npx cap init "Roleplay Vault" "com.roleplay.vault" --web-dir dist
    - npx cap add android
    - npx cap sync android
    - |
      echo 'configurations.all { resolutionStrategy { exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"; exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8" } }' >> android/app/build.gradle
    # --- Release signing configuration ---
    # If signing variables are set, build a signed release APK.
    # Otherwise, fall back to the debug build.
    - |
      if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
        echo "Signing variables detected — building signed release APK..."
        echo "$KEYSTORE_BASE64" | base64 -d > android/app/release-key.jks

        # Inject signingConfigs into android/app/build.gradle
        sed -i '/^android {/a \
    signingConfigs {\
        release {\
            storeFile file("release-key.jks")\
            storePassword "'"$KEYSTORE_PASSWORD"'"\
            keyAlias "'"$KEY_ALIAS"'"\
            keyPassword "'"$KEY_PASSWORD"'"\
        }\
    }' android/app/build.gradle

        # Set the release build type to use our signing config
        sed -i '/buildTypes {/,/}/ { /release {/a \
            signingConfig signingConfigs.release
        }' android/app/build.gradle

        cd android
        chmod +x gradlew
        ./gradlew assembleRelease

        # Copy the release APK to a predictable location for artifacts
        cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/app-signed.apk
      else
        echo "WARNING: Signing variables not configured — building debug APK."
        echo "To enable signed release builds, add these CI/CD variables:"
        echo "  KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD"
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug
        cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/app-signed.apk
      fi
  artifacts:
    name: "Roleplay-Vault-APK"
    paths:
      - android/app/build/outputs/apk/app-signed.apk
    expire_in: 1 week
